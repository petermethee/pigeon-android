# Pigeon : compile l'APK à chaque modification de la branche "pigeon" et le publie
# comme "release" GitHub. L'app Obtainium sur le téléphone détecte la nouvelle release
# et propose de l'installer.
#
# Signature :
# - si la clé privée de Pigeon est enregistrée dans les secrets GitHub (PIGEON_KEYSTORE_BASE64,
#   PIGEON_KEYSTORE_PASSWORD, PIGEON_KEY_ALIAS, PIGEON_KEY_PASSWORD), l'APK est la version "release"
#   (app "Pigeon", optimisée, non déboguable), signée avec cette clé ;
# - sinon, version de debug signée avec la clé de debug du dépôt (app/signature/debug.keystore).

name: Pigeon APK

on:
  push:
    branches: [ pigeon ]
  workflow_dispatch:

# Une seule compilation à la fois : une nouvelle modification annule la précédente.
concurrency:
  group: pigeon-apk
  cancel-in-progress: true

permissions:
  contents: write # pour créer la release

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  build:
    name: Compiler et publier l'APK
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle (avec cache, pour accélérer les compilations suivantes)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Compiler l'APK
        env:
          KEYSTORE_BASE64: ${{ secrets.PIGEON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIGEON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIGEON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIGEON_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Version optimisée, non déboguable. Element la signe avec la clé de debug : on la re-signe avec la clé privée.
            ./gradlew :app:assembleGplayRelease --stacktrace --no-configuration-cache
            KEYSTORE="$RUNNER_TEMP/pigeon.keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "$RUNNER_TEMP/pigeon.apk" \
              app/build/outputs/apk/gplay/release/app-gplay-arm64-v8a-release.apk
            rm -f "$KEYSTORE"
            "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/pigeon.apk" | grep -i "certificate DN"
            echo "APK_PATH=$RUNNER_TEMP/pigeon.apk" >> "$GITHUB_ENV"
          else
            ./gradlew :app:assembleGplayDebug --stacktrace --no-configuration-cache
            echo "APK_PATH=app/build/outputs/apk/gplay/debug/app-gplay-arm64-v8a-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pigeon-${GITHUB_RUN_NUMBER}"
          # Version pour processeurs ARM 64 bits (quasiment tous les téléphones récents) : 4 fois plus légère que la version universelle.
          cp "$APK_PATH" "pigeon-${GITHUB_RUN_NUMBER}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Run relancé : la release existe déjà, on remplace seulement son APK.
            gh release upload "$TAG" "pigeon-${GITHUB_RUN_NUMBER}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "pigeon-${GITHUB_RUN_NUMBER}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pigeon ${GITHUB_RUN_NUMBER}" \
              --notes "$(git log -1 --format='%s%n%n%b' "$GITHUB_SHA")" \
              --latest
          fi
